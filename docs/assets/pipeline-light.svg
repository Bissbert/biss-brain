<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-label="How biss-brain works: hooks queue events, a flush daemon distills and embeds them into a local store, recall injects them into later sessions, and a nightly dream pass consolidates the store.">
