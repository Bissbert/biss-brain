[project]
name = "biss-brain"
version = "0.9.0"
description = "Local RAG brain for Claude Code"
requires-python = ">=3.12"
dependencies = [
    "lancedb==0.30.2",
    "pyarrow>=17",
    "httpx>=0.27",
    "mcp[cli]>=1.2",
    "pydantic>=2",
    "FlagEmbedding>=1.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "anyio[trio]>=4"]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
